name: E2E

# The embedding contract in a real browser: the help desk Worker (wrangler dev --local), the
# TanStack Start reference app (vite dev) talking to it over a service binding, and Chrome.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Pin npm
        run: npm install -g npm@11.19.0
      - run: npm ci
      - name: Build the reference app
        run: npm run build -w examples/tanstack-start
      - name: E2E (email → ticket → assign → reply → note; tenant isolation)
        run: npm run e2e -w examples/tanstack-start
        env:
          CHROME: /usr/bin/google-chrome
          E2E_SHOTS: ${{ runner.temp }}/shots
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
